name: Assets Update to WordPress.org

# The asset-update action rsyncs the whole branch over SVN trunk and then refuses
# to commit if anything other than readme.txt differs. It can therefore only run
# on a branch that already mirrors the released trunk. `latest` tracks the
# published release; `dev` carries unreleased work, so pointing this at `dev`
# always aborted with "Other files have been modified; changes not deployed".
# The path filter keeps it from firing on code-only pushes.
on:
  push:
    branches: [ latest ]
    paths:
      - '.wordpress-org/**'
      - 'readme.txt'
  workflow_dispatch:

jobs:
  assets:
    runs-on: ubuntu-latest
    steps:
      # Submodules are required: trunk ships lib/style-handler/*.php and (on
      # `latest`) controls/*, which live in submodules. Without them the rsync
      # would delete those paths from trunk and trip the same abort.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # The controls and style-handler submodules are private repos, which
      # GITHUB_TOKEN can't read. CONTROLS_PAT is a fine-grained PAT limited to
      # EssentialBlocks/controls and EssentialBlocks/style-handler with
      # Contents: read-only.
      - name: Resolve submodule commits
        id: submodules
        run: |
          echo "controls=$(git rev-parse HEAD:controls)" >> "$GITHUB_OUTPUT"
          echo "style_handler=$(git rev-parse HEAD:lib/style-handler)" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        with:
          repository: EssentialBlocks/controls
          ref: ${{ steps.submodules.outputs.controls }}
          path: controls
          token: ${{ secrets.CONTROLS_PAT }}
          persist-credentials: false

      - uses: actions/checkout@v7
        with:
          repository: EssentialBlocks/style-handler
          ref: ${{ steps.submodules.outputs.style_handler }}
          path: lib/style-handler
          token: ${{ secrets.CONTROLS_PAT }}
          persist-credentials: false
      - name: Assets Update
        id: assets
        uses: 10up/action-wordpress-plugin-asset-update@2.2.0
        env:
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
